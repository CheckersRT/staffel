name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --cache .npm-cache --workspace @staffel/workflow
      - uses: actions/upload-artifact@v4
        with:
          name: staffel-workflow-package-candidate
          path: staffel-workflow-*.tgz
          if-no-files-found: error
